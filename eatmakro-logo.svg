<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="EatMakro" xmlns:c2pa="http://c2pa.org/manifest">
  <title>EatMakro</title>
  <desc>Wordmark and scale monogram. The dot over the beam is the weighing pivot.</desc>
  <style>
    .ink { fill: #0F1A22; }
    .hot { fill: #BF1B53; }
    .stroke-ink { stroke: #0F1A22; fill: none; stroke-width: 9; stroke-linecap: round; }
    text { font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #DFE8EE; }
      .hot { fill: #FF5F88; }
      .stroke-ink { stroke: #DFE8EE; }
    }
  </style>

  <!-- ============ monogram: a balance beam holding a tiffin ============ -->
  <g transform="translate(24 30)">
    <!-- pan / dabba -->
    <path class="ink" d="M28 132 h124 a10 10 0 0 1 10 10 v6 c0 34-27 60-62 60h-20c-35 0-62-26-62-60v-6a10 10 0 0 1 10-10z"/>
    <!-- rim highlight -->
    <rect class="hot" x="28" y="132" width="144" height="12" rx="6"/>
    <!-- beam -->
    <path class="stroke-ink" d="M18 108 H182"/>
    <!-- pivot column -->
    <path class="stroke-ink" d="M100 108 V56"/>
    <!-- the pivot dot: the moment of measurement -->
    <circle class="hot" cx="100" cy="42" r="17"/>
    <!-- hangers -->
    <path class="stroke-ink" d="M46 108 L70 132 M154 108 L130 132"/>
  </g>

  <!-- ================== wordmark ================== -->
  <text class="ink" x="232" y="188" font-size="112" font-weight="800"
        letter-spacing="-5" font-stretch="94%">Eat<tspan class="hot">Makro</tspan></text>

  <!-- ================== strapline ================== -->
  <text class="ink" x="236" y="232" font-size="26" font-weight="400"
        letter-spacing="0.5" opacity="0.62">Weighed, not guessed.</text>
</svg>
